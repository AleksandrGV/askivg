<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Hanters</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Подключаем иконки Font Avesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Наш кастомный CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-4 col-sm-4 col-md-4">
                    <a href="index.html" class="navbar-brand">
                        <img src="img/logotype.png" class="img-fluid" alt="Логотип Honey Hanters" style="max-height: 50px;">
                    </a>
                </div>
                <div class="col-8 col-sm-8 col-md-8 text-end">
                    <button class="btn btn-outline-light" id="contactToggle">
                        <i class="bi bi-envelope"></i> Связаться с нами
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Контактная форма (изначально скрыта) -->
    <section id="contactFormSection" class="bg-dark text-white py-4" style="display: none;">
        <div class="container">
            <div class="text-center mb-4">
                <img src="img/contact_icon.png" alt="Оставьте ваш комментарий" width="145" height="145">
            </div>
            <form class="row" id="commentForm" method="post">
                <div class="col-md-6">
                    <div class="mb-4">
                        <label for="nameField" class="form-label">Имя <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nameField" name="name" required>
                        <div class="invalid-feedback">Пожалуйста, введите ваше имя.</div>
                    </div>
                    <div class="mb-4">
                        <label for="emailField" class="form-label">E-Mail <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="emailField" name="email" required>
                        <div class="invalid-feedback">Пожалуйста, введите корректный email.</div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="commentField" class="form-label">Комментарий <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="commentField" name="comment" rows="5" required></textarea>
                    <div class="invalid-feedback">Пожалуйста, введите ваш комментарий.</div>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-danger">Записать</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Основной контент -->
    <main class="container my-5 flex-grow-1">
        <h2 class="text-center mb-5">Выводим комментарии</h2>
        <div id="commentContent" class="card-group text-center">
            <!-- Комментарии будут загружаться сюда динамически -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6 col-md-6">
                    <a href="index.html" class="navbar-brand">
                        <img src="img/logotype.png" alt="Логотип Honey Hanters" class="img-fluid" style="max-height: 40px;">
                    </a>
                </div>
                <div class="col-6 col-md-6 text-end">
                    <a href="#" class="btn me-2 social">
                        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 50 50" width="40" height="40">
                            <!-- КРУГ (измените fill для фона) -->
                            <path fill="currentColor" class="social-vk-bg" d="M25,2C12.318,2,2,12.318,2,25s10.318,23,23,23c12.683,0,23-10.318,23-23S37.683,2,25,2z"/>
                            <!-- ЛОГОТИП (измените fill для иконки внутри) -->
                            <path fill="currentColor" class="social-vk-text" d="M34.973,29.535c2.237,1.986,2.702,2.695,2.778,2.816C38.678,33.821,36.723,34,36.723,34h-4.12c0,0-1.003,0.011-1.86-0.557c-1.397-0.915-2.86-2.689-3.888-2.381C25.992,31.32,26,32.486,26,33.483C26,33.84,25.693,34,25,34s-0.981,0-1.288,0c-2.257,0-4.706-0.76-7.149-3.313c-3.456-3.609-6.487-10.879-6.487-10.879s-0.179-0.366,0.016-0.589c0.221-0.25,0.822-0.218,0.822-0.218L14.909,19c0,0,0.376,0.071,0.646,0.261c0.223,0.156,0.347,0.454,0.347,0.454s0.671,2.216,1.526,3.629c1.67,2.758,2.447,2.828,3.014,2.531C21.27,25.445,21,22.513,21,22.513s0.037-1.259-0.395-1.82c-0.333-0.434-0.97-0.665-1.248-0.701c-0.225-0.029,0.151-0.423,0.63-0.648C20.627,19.059,21.498,18.986,23,19c1.169,0.011,1.506,0.081,1.962,0.186C26.341,19.504,26,20.343,26,23.289c0,0.944-0.13,2.271,0.582,2.711c0.307,0.19,1.359,0.422,3.231-2.618c0.889-1.442,1.596-3.834,1.596-3.834s0.146-0.263,0.373-0.393c0.232-0.133,0.225-0.13,0.543-0.13S35.832,19,36.532,19c0.699,0,1.355-0.008,1.468,0.402c0.162,0.589-0.516,2.607-2.234,4.797C32.943,27.793,32.63,27.457,34.973,29.535z"/>
                        </svg>
                    </a>
                    <a href="#" class="btn social">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="40" height="40">
                            <!-- КРУГ (фон) -->
                            <path fill="currentColor" class="social-fb-bg" d="M25,2C12.318,2,2,12.317,2,25s10.318,23,23,23c12.683,0,23-10.317,23-23S37.683,2,25,2z"/>
                            <!-- БУКВА "f" (иконка) -->
                            <path fill="currentColor" class="social-fb-text" d="M32,16h-3.29C26.772,16,26,16.455,26,17.806V21h6l-1,5h-5v13h-6V26h-3v-5h3v-2.774C20,14.001,21.686,11,26.581,11C29.203,11,32,12,32,12V16z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Подключаем Bootstrap JS и зависимости -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Подключаем jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Наш кастомный JS -->
    <script src="js/script.js"></script>
</body>
</html>
