<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo</title>
    <style>
        #logo_techno:hover .logo-branch {
  stroke: #00FFA3; /* Неоновый эффект */
}
#logo_techno .logo-node {
  transition: stroke 0.3s;
}
#logo_techno:active .logo-node {
  stroke: #FF00FF;
}
    </style>
</head>
<body>
    <svg id="logo_techno" width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон (прямоугольник с прозрачностью) -->
  <rect x="0" y="0" width="200" height="200" fill="none" stroke="currentColor" stroke-width="2" class="logo-bg"/>

  <!-- Ветви (линии-соединения) -->
  <line x1="100" y1="20" x2="50" y2="60" stroke="currentColor" stroke-width="3" class="logo-branch"/>
  <line x1="100" y1="20" x2="150" y2="60" stroke="currentColor" stroke-width="3" class="logo-branch"/>

  <!-- Узлы (круги с буквами) -->
  <circle cx="100" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2" class="logo-node"/>
  <text x="100" y="25" font-family="Courier New" font-size="12" fill="currentColor" text-anchor="middle" class="logo-node-text">G</text>

  <!-- Листья (буквы имен) -->
  <circle cx="50" cy="60" r="10" fill="none" stroke="currentColor" stroke-width="2" class="logo-leaf"/>
  <text x="50" y="63" font-family="Courier New" font-size="10" fill="currentColor" text-anchor="middle" class="logo-leaf-text">A</text>

  <!-- Остальные буквы (аналогично) -->
  <circle cx="150" cy="60" r="10" fill="none" stroke="currentColor" stroke-width="2" class="logo-leaf"/>
  <text x="150" y="63" font-family="Courier New" font-size="10" fill="currentColor" text-anchor="middle" class="logo-leaf-text">S</text>
</svg>

</html>
